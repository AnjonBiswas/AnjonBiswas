<svg width="390" height="165" viewBox="0 0 390 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Tech Radar</title>
  <desc id="descId">Currently exploring UI/UX, AI Tools with UI/UX as the strongest focus</desc>
  <defs>
    <linearGradient id="radarFill" x1="75" y1="58" x2="75" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#70a5fd" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #38bdae;
    }
    .name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #38bdae;
    }
    .muted {
      font: 400 10px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #a9b1d6;
    }
    .tiny {
      font: 700 9px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #70a5fd;
      letter-spacing: 0.7px;
    }
    .ring {
      stroke: #343b55;
      stroke-width: 1;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="164"
    width="389"
    fill="#1a1b27"
    stroke="#e4e2e2"
    stroke-opacity="1"
  />

  <text x="25" y="35" class="header">Exploring and Improving</text>

  <g transform="translate(25 55)">
    <g>
      <rect x="0" y="0" width="118" height="88" rx="8" fill="#202335"/>
      <circle cx="59" cy="45" r="36" class="ring"/>
      <circle cx="59" cy="45" r="24" class="ring"/>
      <circle cx="59" cy="45" r="12" class="ring"/>
      <path d="M59 9V81M23 45H95" stroke="#343b55" stroke-width="1"/>

      <path d="M59 10L85 41L68 68L36 57Z" fill="url(#radarFill)" stroke="#f472b6" stroke-width="2" stroke-linejoin="round"/>

      <circle cx="59" cy="10" r="5.5" fill="#f472b6"/>
      <circle cx="85" cy="41" r="5.5" fill="#70a5fd"/>
      <circle cx="68" cy="68" r="5" fill="#38bdae"/>
      <circle cx="36" cy="57" r="5" fill="#f1e05a"/>

    </g>

    <g transform="translate(140 0)">
      <rect width="210" height="42" rx="8" fill="#24283b"/>
      <text x="13" y="17" class="tiny">TOP FOCUS</text>
      <text x="13" y="35" class="stat" fill="#f8fafc">UI/UX Design</text>
      <circle cx="184" cy="21" r="15" fill="#f472b6" opacity="0.18"/>
      <circle cx="184" cy="21" r="7" fill="#f472b6"/>

      <g transform="translate(0 56)">
        <circle cx="5" cy="6" r="5" fill="#f472b6"/>
        <text x="15" y="10" class="name">UI/UX</text>
      </g>

      <g transform="translate(112 56)">
        <circle cx="5" cy="6" r="5" fill="#70a5fd"/>
        <text x="15" y="10" class="name">AI Tools</text>
      </g>

      <g transform="translate(0 82)">
        <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
        <text x="15" y="10" class="name">Research</text>
      </g>

      <g transform="translate(112 82)">
        <circle cx="5" cy="6" r="5" fill="#38bdae"/>
        <text x="15" y="10" class="name">Problem Solving</text>
      </g>
    </g>
  </g>
