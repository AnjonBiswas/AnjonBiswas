<svg width="390" height="195" viewBox="0 0 390 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="390" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#151621"/>
    </linearGradient>
    <linearGradient id="radarFill" x1="83" y1="67" x2="83" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#70a5fd" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="-20" y="-20" width="220" height="220" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="389" height="194" rx="10" fill="url(#card)" stroke="#c9d1d9"/>
  <style>
    .title {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 19px;
      font-weight: 700;
      fill: #70a5fd;
    }
    .caption {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 12px;
      fill: #a9b1d6;
    }
    .label {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .muted {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 10.5px;
      fill: #a9b1d6;
    }
    .tiny {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      fill: #7aa2f7;
      letter-spacing: 0.8px;
    }
    .ring {
      stroke: #343b55;
      stroke-width: 1;
    }
  </style>

  <text x="22" y="33" class="title">Currently Exploring and Improving</text>

  <g transform="translate(22 66)">
    <rect x="0" y="0" width="124" height="108" rx="12" fill="#202335"/>
    <circle cx="62" cy="56" r="45" class="ring"/>
    <circle cx="62" cy="56" r="30" class="ring"/>
    <circle cx="62" cy="56" r="15" class="ring"/>
    <path d="M62 11V101M17 56H107" stroke="#343b55" stroke-width="1"/>
    <path d="M62 14L99 48L75 91L27 69Z" fill="url(#radarFill)" stroke="#f472b6" stroke-width="2.4" stroke-linejoin="round"/>

    <circle cx="62" cy="14" r="7" fill="#f472b6" filter="url(#softGlow)"/>
    <circle cx="99" cy="48" r="5" fill="#70a5fd"/>
    <circle cx="75" cy="91" r="5" fill="#38bdae"/>
    <circle cx="27" cy="69" r="5" fill="#f9e64f"/>

    <rect x="39" y="31" width="46" height="18" rx="9" fill="#2b2f45"/>
    <text x="47" y="44" class="muted">UI/UX</text>
  </g>

  <g transform="translate(164 66)">
    <rect width="204" height="52" rx="12" fill="#24283b"/>
    <text x="16" y="20" class="tiny">TOP FOCUS</text>
    <text x="16" y="43" class="label" style="font-size: 18px;">UI/UX Design</text>
    <circle cx="173" cy="26" r="19" fill="#f472b6" opacity="0.16"/>
    <circle cx="173" cy="26" r="9" fill="#f472b6"/>
  </g>

  <g transform="translate(164 128)">
    <rect width="94" height="24" rx="12" fill="#24283b"/>
    <circle cx="14" cy="12" r="5" fill="#70a5fd"/>
    <text x="27" y="16" class="muted">AI Tools</text>

    <rect x="104" width="100" height="24" rx="12" fill="#24283b"/>
    <circle cx="118" cy="12" r="5" fill="#f9e64f"/>
    <text x="131" y="16" class="muted">API Work</text>

    <rect y="34" width="122" height="24" rx="12" fill="#24283b"/>
    <circle cx="14" cy="46" r="5" fill="#38bdae"/>
    <text x="27" y="50" class="muted">Performance</text>
  </g>
