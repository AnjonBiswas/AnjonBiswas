<svg width="390" height="165" viewBox="0 0 390 165" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="390" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#151621"/>
    </linearGradient>
    <linearGradient id="radarFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f472b6" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#70a5fd" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="glow" x="-18" y="-18" width="160" height="160" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="389" height="164" rx="8" fill="url(#card)" stroke="#c9d1d9"/>
  <style>
    .title {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #70a5fd;
    }
    .label {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .muted {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 10.5px;
      fill: #a9b1d6;
    }
    .tiny {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      fill: #7aa2f7;
      letter-spacing: 0.8px;
    }
    .ring {
      stroke: #343b55;
      stroke-width: 1;
    }
  </style>

  <text x="22" y="34" class="title">Currently Exploring</text>

  <g transform="translate(22 50)">
    <rect width="122" height="96" rx="10" fill="#202335"/>
    <circle cx="61" cy="50" r="39" class="ring"/>
    <circle cx="61" cy="50" r="26" class="ring"/>
    <circle cx="61" cy="50" r="13" class="ring"/>
    <path d="M61 11V89M22 50H100" stroke="#343b55" stroke-width="1"/>
    <path d="M61 14L95 44L74 82L29 64Z" fill="url(#radarFill)" stroke="#f472b6" stroke-width="2.2" stroke-linejoin="round"/>

    <circle cx="61" cy="14" r="8" fill="#f472b6" filter="url(#glow)"/>
    <circle cx="95" cy="44" r="5" fill="#70a5fd"/>
    <circle cx="74" cy="82" r="5" fill="#38bdae"/>
    <circle cx="29" cy="64" r="5" fill="#f9e64f"/>

    <rect x="38" y="31" width="46" height="18" rx="9" fill="#2b2f45"/>
    <text x="46" y="44" class="muted">UI/UX</text>
  </g>

  <g transform="translate(164 50)">
    <rect width="204" height="46" rx="10" fill="#24283b"/>
    <text x="16" y="18" class="tiny">TOP FOCUS</text>
    <text x="16" y="38" class="label" style="font-size: 17px;">UI/UX Design</text>
    <circle cx="174" cy="23" r="18" fill="#f472b6" opacity="0.16"/>
    <circle cx="174" cy="23" r="8" fill="#f472b6"/>
  </g>

  <g transform="translate(164 106)">
    <rect width="94" height="23" rx="11.5" fill="#24283b"/>
    <circle cx="14" cy="11.5" r="5" fill="#70a5fd"/>
    <text x="27" y="15.5" class="muted">AI Tools</text>

    <rect x="104" width="100" height="23" rx="11.5" fill="#24283b"/>
    <circle cx="118" cy="11.5" r="5" fill="#f9e64f"/>
    <text x="131" y="15.5" class="muted">API Work</text>

    <rect y="31" width="122" height="23" rx="11.5" fill="#24283b"/>
    <circle cx="14" cy="42.5" r="5" fill="#38bdae"/>
    <text x="27" y="46.5" class="muted">Performance</text>
  </g>
